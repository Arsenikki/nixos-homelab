name: update-flake-lock

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays

permissions:
  contents: write
  pull-requests: write

jobs:
  lock:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          pr-title: "chore(flake): update flake.lock"
          pr-labels: dependencies
